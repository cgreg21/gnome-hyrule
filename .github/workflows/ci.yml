name: Theme validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Capture theme screenshots", "Capture GNOME Shell 51 screenshots"]
    types: [completed]

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon drawing library
        run: python -m pip install --disable-pip-version-check "Pillow==11.1.0"
      - name: Validate scripts, SVGs, PNGs, and theme layout
        run: bash scripts/check.sh
