name: Theme validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon drawing library
        run: python -m pip install --disable-pip-version-check "Pillow==11.1.0"
      - name: Verify generated PNGs are reproducible
        run: |
          python scripts/draw-icons.py
          git diff --exit-code -- icons/Hyrule-Icons/128x128
      - name: Validate scripts, SVGs, PNGs, and theme layout
        run: bash scripts/check.sh
