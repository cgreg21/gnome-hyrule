name: Generate Hyrule 9-slice PNG textures

on:
  push:
    branches: [main]
    paths:
      - "scripts/draw-theme-textures.py"
      - ".github/workflows/theme-textures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4\n        with:\n          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.1.0"
      - name: Generate PNG textures
        run: python scripts/draw-theme-textures.py
      - name: Commit generated assets
        run: |
          git add themes/Hyrule-Pixel/assets/*.png
          if git diff --cached --quiet; then
            echo "PNG textures are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Hyrule pixel-art 9-slice PNG textures"
          git push
