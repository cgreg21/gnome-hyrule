name: Generate Hyrule AI icons

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/draw-icons.py"
      - ".github/workflows/draw-icons.yml"

permissions:
  contents: write

concurrency:
  group: draw-hyrule-icons
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing library
        run: python -m pip install --disable-pip-version-check "Pillow==11.1.0"
      - name: Generate AI artwork with FLUX.1 Schnell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/draw-icons.py
      - name: Validate generated assets
        run: bash scripts/check.sh
      - name: Commit generated PNG icons
        run: |
          git add -A icons/Hyrule-Icons/512x512
          if git diff --cached --quiet; then
            echo "AI-generated icons are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art: generate Hyrule icons with FLUX.1 Schnell"
          git push
