name: Draw Hyrule icons

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/draw-icons.py"
      - ".github/workflows/draw-icons.yml"

permissions:
  contents: write

concurrency:
  group: draw-hyrule-icons
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install drawing library
        run: python -m pip install --disable-pip-version-check "Pillow==11.1.0"
      - name: Draw pixel icons
        run: python scripts/draw-icons.py
      - name: Validate generated theme
        run: bash scripts/check.sh
      - name: Commit generated PNG icons
        run: |
          git add -A icons/Hyrule-Icons/128x128
          if git diff --cached --quiet; then
            echo "Icons are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art: regenerate Hyrule pixel icons with Pillow"
          git push
