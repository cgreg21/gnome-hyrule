name: Generate Hyrule AI icons

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/draw-icons.py"
      - ".github/workflows/draw-icons.yml"

permissions:
  contents: write

concurrency:
  group: draw-hyrule-icons
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Cloudflare credentials are missing. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI generation skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable it."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing library
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check "Pillow==11.1.0"
      - name: Generate AI artwork with FLUX.1 Schnell
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/draw-icons.py
      - name: Validate generated assets
        if: steps.credentials.outputs.ready == 'true'
        run: bash scripts/check.sh
      - name: Commit generated PNG icons
        if: steps.credentials.outputs.ready == 'true'
        run: |
          git add -A icons/Hyrule-Icons/512x512
          if git diff --cached --quiet; then
            echo "AI-generated icons are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art: generate Hyrule icons with FLUX.1 Schnell"
          git push
